# Publishes an oks release when main is pushed.
# A tag push does not run this job.
# The next version is the next v1 minor: v1.0.0, then v1.1.0, then v1.2.0.
# GoReleaser builds the archives. The GitHub Release is created from those files.

name: Release OKS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Choose the next minor version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          latest="$(git tag -l 'v1.*' | grep -E '^v1\.[0-9]+\.0$' | sort -V | tail -n 1 || true)"
          if [ -z "${latest}" ]; then
            tag="v1.0.0"
          else
            minor="${latest#v1.}"
            minor="${minor%.0}"
            tag="v1.$((minor + 1)).0"
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "Releasing ${tag}"
          git tag "${tag}"

      - name: Build archives
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=publish,validate,before

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "oks ${TAG}" \
            --notes "oks ${TAG}" \
            "dist/oks_${VERSION}_linux_amd64.tar.gz" \
            "dist/oks_${VERSION}_linux_arm64.tar.gz" \
            "dist/oks_${VERSION}_darwin_amd64.tar.gz" \
            "dist/oks_${VERSION}_darwin_arm64.tar.gz" \
            "dist/oks_${VERSION}_windows_amd64.zip" \
            "dist/oks_${VERSION}_windows_arm64.zip" \
            "dist/checksums.txt"
